# Use with "conda env create -f environment.yml" command
# (Includes Jupyter, PyYAML, Plotting libraries, and Snakemake)
name: mass-imaging-analysis
channels:
  - conda-forge # Best channel for pyimzml and scientific packages
  - bioconda
  - defaults
dependencies:
  - python=3.11 # Specify base Python version
  
  # Core parsing
  - pyimzml     # Install from conda-forge
  - pandas      # Install from conda-forge
  - numpy       # (pyimzml installs automatically, but good to specify)
  - lxml        # (pyimzml installs automatically)
  - pyyaml      # Essential for config.yaml parsing
  - numpy
  
  # Statistics
  - scipy       # For statistical analysis
  - statsmodels # For statistical analysis
  - scikit-learn # For dimensionality reduction (PCA, t-SNE) and data preprocessing
  
  # Plotting
  - seaborn     
  - matplotlib  
  
  # Notebook
  - jupyterlab  # Essential for running main.ipynb
  - notebook
  
  # Workflow management
  - snakemake   # For running Snakefile pipeline
  - snakemake-minimal  # Lightweight version (optional)

  # pip also managed by conda
  - pip
