#----------------------
# System Configuration
#----------------------
# Internal use for Snakemake to identify the active config file
__config_file__: "config/config.yaml"

#----------------------
# directory path
#----------------------
# Paths are relative to the project root where Snakemake is executed.
data_dir: "data/processed"
output_dir: "output/4_groups"

#----------------------
# Group parameters 
#----------------------
# This section defines the experimental groups and their samples.
#
# Configuration Options:
# 1. name: Group name (required)
# 2. n_per_group: Number of individuals in the group (optional if individual_ids is provided)
# 3. individual_ids: List of specific individual IDs (optional)
#    - If omitted, IDs default to 1 to n_per_group (e.g., [1, 2, 3]).
#    - If provided, n_per_group is automatically inferred from the list length.
# 4. num_serial: Number of serial sections per individual (optional if serial_ids is provided)
#    - Can be an integer (same for all individuals) or a list (per individual).
# 5. serial_ids: Explicit list of serial section IDs per individual (optional)
#    - Use this for non-sequential serial IDs (e.g., only section 2 exists: [2]).
#    - Must be a list of lists, e.g., [[1, 2], [2], [1, 2]].
#    - If provided, this OVERRIDES num_serial.

group_info:
  # Example 1: Standard configuration (Sequential IDs)
  # - 3 individuals (IDs 1, 2, 3)
  # - Same number of serial sections (2) for all
  - name: "control"
    n_per_group: 3
    num_serial: 2  # All individuals have sections 1 and 2

  # Example 2: Custom Individual IDs
  # - 3 individuals with IDs 2, 4, 6
  # - Different number of serial sections per individual
  - name: "saline"
    individual_ids: [2, 4, 6]  # n_per_group is inferred as 3
    num_serial: [2, 1, 3]      # ID 2: 2 sections, ID 4: 1 section, ID 6: 3 sections

  # Example 3: Flexible Serial IDs (Non-sequential)
  # - 3 individuals (IDs 1, 2, 3)
  # - Specific serial IDs specified (e.g., missing section 1 for the second individual)
  - name: "glyoxylate"
    n_per_group: 3
    serial_ids:
      - [1, 2]    # Mouse 1: sections 1, 2
      - [2]       # Mouse 2: section 2 only (section 1 missing)
      - [1, 2, 3] # Mouse 3: sections 1, 2, 3

  # Example 4: Mixed Configuration
  - name: "acetate"
    individual_ids: [1, 3, 5, 7]
    num_serial: [1, 2, 2, 3]

#----------------------
# ROI parameters
#----------------------
roi_info:
  - name: "cortex"
  # - name: "hippocampus"

#----------------------
# Binning parameters
#----------------------
binning_settings:
  # 'mode' can be either 'file' or 'direct'.
  # 'file': Read m/z ranges from the .csv file specified in 'file_path'.
  # 'direct': Use m/z ranges directly defined in 'direct_bins'.
  
  mode: "file" # or "direct"

  # --- Mode 1: 'file' setting ---
  file_path: "config/Mass ranges of molecules.csv"

  # --- Mode 2: 'direct' setting (not used when 'file' mode is active) ---
  # To use this method instead of 'file_path', change to mode: "direct".
  direct_bins:
    - mz: 72.9926
      width: 0.003
      name: "Bin 1 (72)"
    - mz: 102.055
      width: 0.003
      name: "Bin 2 (102)"

#----------------------
# Outlier Detection Settings
#----------------------
outlier_detection:
  # Enable/disable outlier detection for mean intensity calculation
  # When enabled, outliers are removed before computing bin-level averages
  enabled: false  # Set to true to enable outlier filtering
  
  # Detection method: 'modified_z', 'z_score', or 'iqr'
  # - modified_z: Robust to non-normal distributions (RECOMMENDED)
  # - z_score: Assumes normal distribution
  # - iqr: Distribution-free, very conservative
  method: "modified_z"
  
  # Cutoff threshold (interpretation depends on method):
  # - modified_z: 3.5 (recommended, detects extreme outliers)
  # - z_score: 2.5-3.0 (2.5=more sensitive, 3.0=more conservative)
  # - iqr: 1.5-3.0 (1.5=standard Tukey's fences, 3.0=very conservative)
  cutoff: 3.5
  
  # Minimum number of data points required after outlier removal
  # If fewer points remain, use all original data (safety check)
  min_remaining: 3

#----------------------
# Statistics settings
#----------------------
statistics_settings:
  # Choose 'parametric' or 'non_parametric' test
  # For n=3, sample size is very small, so 'non_parametric' is strongly recommended.
  test_type: "parametric" # 'parametric' | 'non_parametric'
  
  # Statistical significance threshold (p-value)
  p_value_threshold: 0.05
  
  # Multiple comparison correction method (for multiple m/z bins)
  # 'fdr_bh': Benjamini-Hochberg FDR control (recommended, default)
  #           - Less conservative, controls false discovery rate
  #           - Standard for metabolomics/proteomics data
  # 'bonferroni': Bonferroni correction (very conservative)
  #               - Controls family-wise error rate
  #               - Use when false positives are critical
  # 'none': No correction (not recommended for multiple bins)
  #         - Use only for single hypothesis testing
  multiple_comparison_correction: "fdr_bh"

#----------------------
# Report settings
#----------------------
report_settings:
  title: "Mass Imaging Analysis Report" # Report title
